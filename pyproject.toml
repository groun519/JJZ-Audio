[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jang-audio-app"
dynamic = ["version"]
description = "Local desktop audio workflow app."
requires-python = ">=3.11"
dependencies = [
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "demucs>=4.0.1",
    "soundfile>=0.12.1",
    "tkinterdnd2>=0.4.3",
    "PySide6>=6.7.0",
    "yt-dlp>=2025.1.15",
]

[project.scripts]
jang-audio = "jang_app.qt_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "jang_app.version.__version__"}

[tool.setuptools.package-data]
jang_app = ["assets/*.svg"]
